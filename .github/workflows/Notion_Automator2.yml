name: Notion Automator2
 
on:
  schedule:
    # Läuft alle 10 Minuten (GitHub minimum ist 5 Min., 10 Min. ist zuverlässiger)
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Erlaubt manuelles Starten per Knopfdruck auf GitHub
 
jobs:
  run-automator:
    runs-on: ubuntu-latest
 
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
 
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Abhängigkeiten installieren
        run: |
          pip install requests python-dateutil
 
      - name: Notion Automator ausführen
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: python notion_automator.py
 
